publications:
  - title: 'Transit Access Stories: The State of Transportation Equity in Seven Cities'
    date: '2024-08-01'
    url: https://transitcenter.org/publication/transit-access-stories/
    description: To create transit systems that work for everyone, transit agencies, and advocates must first understand how well people of varying identities can or can’t access what they need to thrive. These Transit Access Stories combine transportation access to opportunity data, quotes from riders, and other data sources to demonstrate how decisions from transportation leaders on service planning, policy, and funding impact how people can access their daily needs in seven US cities. Advocates can use this information to demand change from transportation decision-makers, and transit decision-makers can apply our data to implement solutions within their systems.
  - title: Checking in on Washington DC’s Transit Recovery
    date: '2023-02-16'
    url: https://transitcenter.org/checking-in-on-washington-dcs-transit-recovery/
    description: As part of our exploration into what our Equity Dashboard reveals about transit access in the seven highest ridership U.S. cities, this blog post takes a deeper look at Washington D.C. In this analysis, we focus primarily on the District itself, rather than the full DMV metropolitan region, to illuminate the particularly glaring disparities in access to opportunity via transit within the core city.
  - title: What Does Our Equity Dashboard Reveal about Transit Access in Boston?
    date: '2023-01-23'
    url: https://transitcenter.org/what-does-our-equity-dashboard-reveal-about-transit-access-in-boston/
    description: We evaluate how well Boston residents could access essential destinations like healthcare, jobs, and grocery stores via public transit from February 2020 (right before the pandemic hit) through early August 2022.
  - title: 'Exploring 2022’s Big Transit Themes with New Equity Dashboard Data: Part Two'
    date: '2022-12-21'
    url: https://transitcenter.org/exploring-2022-transit-themes-with-equity-dashboard-data-part-two/
    description: Part two looks at at the “new normal” service patterns emerging at three agencies – New York’s MTA, Philadelphia’s SEPTA, and SFMTA – and explores whether these agencies are closing access gaps, or lapsing back into longstanding inequities.
  - title: 'Exploring 2022’s Big Transit Themes with New Equity Dashboard Data: Part One'
    date: '2022-12-19'
    url: https://transitcenter.org/exploring-2022s-big-transit-themes-with-new-equity-dashboard-data/
    description: Part one of our 2022 summary, takes a look at how four agencies – Boston’s MBTA, DC’s WMATA, LA Metro, and Chicago’s CTA – responded to crises this year.
  - title: LA’s Bus Network Redesign Hamstrung by Operator Shortfall
    date: '2022-05-03'
    url: https://transitcenter.org/the-unfulfilled-promise-of-nextgen/
    description: We found that if LA Metro were able to fully implement the new NextGen bus network, transit riders across Los Angeles County would gain substantial access to essential destinations. Jobs, healthcare, and other places would become easier than ever to reach by public transit, even surpassing the pre-Covid-19 benchmark.
  - title: 'High Frequency Podcast: Measuring Transit Equity in Six Cities'
    date: '2021-08-12'
    url: https://high-frequency.simplecast.com/episodes/s2-ep-6-mary-buchanan-ron-thompson-measuring-transit-equity-in-6-cities
    description: In June, TransitCenter released the Transit Equity Dashboard. The dashboard uses maps and graphs to show how transit access varies by race, class, and other demographic factors in 6 major urban regions. TransitCenter Senior Research Associate Mary Buchanan explains the importance of access to opportunity metrics, and how these metrics can be used to measure equity. Mary also shares major findings from the dashboard, and explains how this type of data can bolster advocacy efforts for more equitable service.
  - title: 'Going Above and Beyond: Advice to USDOT on Measuring Transportation Equity'
    date: '2021-08-06'
    url: https://transitcenter.org/going-above-and-beyond-advice-to-usdot-on-measuring-transportation-equity/
    description: A look at how USDOT could better assess transport equity.
  - title: Introducing the Transit Equity Dashboard
    date: '2021-06-17'
    url: https://transitcenter.org/introducing-the-transit-equity-dashboard/
    description: This dashboard aims to help transit practitioners, policymakers, and advocates make more informed and equitable decisions by providing clear metrics about access disparities. By adopting these metrics, we can assess whether changes to transit networks close or widen these gaps.
