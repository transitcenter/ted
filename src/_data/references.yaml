  - title: 'Living on a fare: Modeling and quantifying the effects of fare budgets on transit access and equity'
    author: Diego Da Silva, Willem Klumpenhouwer, and Alex Karner
    journal: Journal of Transport Geography
    year: 2022
    url: https://www.sciencedirect.com/science/article/pii/S0966692322000710
    description: While premium transit modes such as commuter rail can improve access to opportunities, the higher fares that accompany these services create barriers to their use. Fare-sensitive access measures require accurate estimation of fare costs between origins and destinations. They are not often included in public transit access analyses because of data limitations and modeling complexity. In this paper, we introduce a flexible and scalable fare calculator that encodes complex fare structures as permissions or “rules” and is able to estimate an origin-destination fare cost from a transit itinerary produced separately. We leverage this fare calculator to examine how access and equity are impacted by fares across seven major urban areas in the United States. We find that fares can act as a substantial barrier to job access, this barrier is not equitably distributed across sociodemographic groups within and between cities, and changes in transit service due to the Covid-19 pandemic has affected access disparities.
  - title: Reallocating Washington, D.C.’s Road Space to Reduce Driving, Improve Safety, and Promote Transportation Equity
    author: Andrew Grinberg
    journal: Masters Project, Georgetown Univeristy
    year: 2021
    url: https://repository.library.georgetown.edu/bitstream/handle/10822/1078077/Andrew%20Grinberg_Capstone.pdf?sequence=1&isAllowed=y
    description: |-
      This study evaluates how Washington, D.C. allocates its public right-of-way, or road space, for
      different uses - travel lanes, parking, bike lanes, and sidewalks. How a city manages its single
      largest public space asset (its streets and sidewalks), impacts its character and performance,
      including transportation mode shares, traffic safety, and access for its residents, workers, and
      visitors. These metrics are critical, as the U.S. transportation system is the largest (and growing)
      source of greenhouse gas emissions, causes roughly 40,000 deaths a year, and is a key
      determinant of economic and social mobility. This project utilizes publicly accessible datasets,
      analyzed in ArcGIS Pro to explore the distribution of road space allocations at the census tract
      level across D.C.’s geography and by demographic indicators to evaluate how and where road
      space allocations could be altered to advance existing policy goals for commute mode shares,
      traffic safety and transportation equity. This project finds that D.C.’s road space allocation could
      be altered to better support District initiatives to reduce driving commute mode share, reduce
      fatal and serious injury traffic crashes and the equitable distribution of pedestrian and bike-
      oriented streets. This study makes the case that to further its stated policy goals, D.C. should use
      geographically targeted road space reallocation strategies to shift auto-oriented road space
      toward more active transportation uses.
  - title: A Comprehensive Transit Accessibility and Equity Dashboard
    author: Willem Klumpenhouwer, Jeff Allen, Lisa Li, Rick Liu, Mitchell Robinson, Diego Da Silva, Steven Farber, Alex Karner, Dana Rowangould, Mary Buchanan, and Steven Higashide
    journal: Findings
    year: 2021
    url: https://findingspress.org/article/25224-a-comprehensive-transit-accessibility-and-equity-dashboard
    description: The TransitCenter Equity Dashboard tracks how well public transit systems in seven densely populated urban regions in the United States serve their riders and how changes to transit service affect riders over space, time, and cost constraints. The dashboard presents a series of charts and interactive maps that can be used to evaluate variations in transit accessibility and equity. It was created using publicly available data and primarily open-source software. All measures can be accessed by users seeking to conduct their own analyses. Results demonstrate differences in agency responses to COVID-19 as well as baseline transit service levels provided to different demographic groups.

