academic:
  - title: 'Transportation policy: a neglected social policy domain and aspect of social well-being in social policy/welfare regime research'
    author: Chase Harms
    journal: PhD Thesis, University of Manitoba
    year: 2024
    url: https://mspace.lib.umanitoba.ca/items/c8b4a19a-a4e2-42ab-8700-a4d12595e61b
    description: |-
      Mobility plays a decidedly central role in the life of virtually every human in our world. Being able to move from one point to another is absolutely critical to meeting our most basic everyday needs. In the modern era, travel for work, school, leisure, and myriad other quotidian activities, including getting groceries, visiting with friends and relatives, and getting to medical appointments, are just a few of the central reasons for routine travel today. This study underscores the importance of transportation and mobility as a core aspect of human well-being, and as such, an important policy domain that should occupy a central position in the world of welfare and welfare state research. However, despite its import, transportation policy has been largely neglected in the research on well-being and welfare states. This is most strikingly evident in the research on welfare state models and typologies. This study focuses on three key dimensions of well-being, (1) inequality, (2) safety, and (3) environment, highlighting the many ways that transportation policy affects our lives, and makes a case for its inclusion as an important policy domain and component of modern welfare states. Employing Gøsta Esping-
      Andersen’s widely-embraced welfare state/worlds typology, it examines the character of transportation policy in three cities (Kansas City, MO, US; Stockholm, Sweden; and Luxembourg City, Luxembourg), representing each of his three welfare regimes (liberal, social democratic, and conservative, respectively). It focuses on a range of key indicators of these three dimensions, including fare provision, service availability, pedestrian infrastructure, and ticketing systems for the inequality dimension; programming in infrastructure safety and reduced road access, as well as legislation for driver training and consequences for illegal acts on the road for safety dimension; and provisions of green space, parking and urban access regulations, and environmental regulations on vehicles for the environmental dimension. Its central conclusion is that future discussion and research on welfare states should consider transportation policy as a central social policy domain.
  - title: 'The Opportunity Cost: Using a Narrative Approach to Reframe Pro-equity Urban Informatics'
    author: Andrew Hamann and Roderick Crooks
    journal: Companion Publication of the 2023 Conference on Computer Supported Cooperative Work and Social Computing
    year: 2023
    url: https://dl.acm.org/doi/pdf/10.1145/3584931.3607005
    description: |-
      This paper is an exploration of storytelling in an urban data dash-
      board. We follow two frameworks to describe the narrative ele-
      ments (characters, spatial dimension, sequentiality & temporality,
      and tellability) of the dashboard. This narrative analysis allows us
      to characterize the narrative work that urban dashboards do, en-
      abling the interpretation that produces meaning from data. Given
      the duality of data and data visualization and their primacy in both
      directing and critiquing racialized state power, this poster argues
      that understanding narrative is vital to determining how, when, and
      why particular kinds of data visualizations might serve authentic
      community-defined political goals and when they do not. We aim
      to start a line of inquiry into how analytic attention to narrative in
      data visualization can support political change through agonistic
      data practices.
  - title: 'Insights to Support Transportation Equity in Rural America: A Primer and Practical Compilation of Concepts, Resources, Tools, and Reforms'
    author: Andrea Hamre and David Kack
    journal: Western Transportation Institute Report
    year: 2023
    url: https://westerntransportationinstitute.org/wp-content/uploads/2023/08/20230817-4W9477-Final-Report.pdf
    description: |-
      The primary purpose of this project was to review, analyze, and compile information and resources to support transportation equity in
      rural communities throughout the U.S. We used publicly available databases and information in the form of published reports, articles,
      and presentations to examine the following research questions:
      • What resources are available to support transportation equity in rural communities?
      • What measures are available to guide the assessment of transportation equity and the prioritization of transportation
      investments?
      • What transportation policy and program innovations and reforms are available to support transportation equity in rural
      communities?
      We provide a review of key concepts (including rural, equity, mobility, and accessibility), key resources (from the Legislative and
      Executive Branches as well as the Transportation Research Board and additional entities), measures (including tools to identify people
      and places for equity considerations as well as tools for measuring the impact of projects), and reforms (including reforms to support
      expanded access to travel such as universal basic mobility, and reforms to improve travel conditions such as sidewalk network
      improvements). With this primer report, we hope rural transportation practitioners feel more informed about transportation equity
      concepts, resources, tools, and reforms, and empowered to support transportation equity policies and programs for fairness and justice
      in their communities.
  - title: 'High Capacity Transit Through Merrimack Valley Corridor: Feasibility and Alternatives for Improved Transit Throughout the Region'
    author: Henry Mulvey
    journal: Masters Project, University of Massachusetts Amherst
    year: 2023
    url: https://scholarworks.umass.edu/cgi/viewcontent.cgi?article=1116&context=larp_ms_projects
    description: |-
      Presently, the interurban bus routes of the Merrimack Valley Regional Transit Authority (MeVa)
      connecting Lawrence, Lowell, and Haverhill have the highest ridership of any of the routes on
      the MeVa system. Connecting those three cities, and the surrounding suburbs and UMass
      Lowell, with a light rail line or a bus rapid transit line, would improve the commute of the people
      already using those bus routes and draw more residents to public transit. This project undertook
      corridor-based alternatives and feasibility analysis that looked at a specific proposal for a high
      capacity transit line connecting the three cities that would be beneficial to transit planning in the
      region. Several different alignments between the three cities were studied for the routing with
      the optimal characteristics for high transit ridership. Several GIS and other mapping analyses
      were applied to these alignments to determine if they would provide sustainable ridership for a
      high capacity transit service. A light rail line, or a bus rapid transit line, between Lowell,
      Lawrence and Haverhill would significantly benefit the greater Merrimack Valley region in a
      number of different ways.
